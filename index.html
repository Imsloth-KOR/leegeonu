<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Leegeonu — Current Slice</title>
  <meta name="description" content="Portfolio and archive by Leegeonu. Past as analogue traces, future as digital possibilities.">

  <style>
    :root {
      --bg: #080909;
      --text: #f4f1ea;
      --muted: rgba(244, 241, 234, 0.62);
      --faint: rgba(244, 241, 234, 0.18);
      --line: rgba(244, 241, 234, 0.34);
      --bright: rgba(244, 241, 234, 0.94);
      --side: clamp(28px, 3.8vw, 56px);
      --sans: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      width: 100%;
      min-height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: var(--sans);
      overflow: hidden;
      user-select: none;
      -webkit-user-select: none;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    .page {
      position: relative;
      width: 100vw;
      height: 100vh;
      min-height: 680px;
      overflow: hidden;
      background:
        radial-gradient(circle at 50% 50%, rgba(255, 255, 255, 0.08), transparent 19%),
        radial-gradient(circle at 28% 50%, rgba(255, 255, 255, 0.045), transparent 34%),
        radial-gradient(circle at 74% 50%, rgba(255, 255, 255, 0.04), transparent 34%),
        linear-gradient(90deg, #080909 0%, #111213 50%, #070808 100%);
    }

    .page::before {
      content: "";
      position: absolute;
      inset: 0;
      pointer-events: none;
      opacity: 0.22;
      background:
        radial-gradient(circle at 50% 50%, transparent 0%, transparent 52%, rgba(0,0,0,0.48) 100%),
        repeating-linear-gradient(0deg, rgba(255,255,255,0.015) 0 1px, transparent 1px 4px);
    }

    .site-header {
      position: absolute;
      top: 38px;
      left: var(--side);
      right: var(--side);
      z-index: 10;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 32px;
    }

    .brand {
      font-size: clamp(19px, 1.45vw, 23px);
      font-weight: 500;
      letter-spacing: -0.02em;
    }

    .nav {
      display: flex;
      gap: clamp(28px, 4.4vw, 72px);
      font-size: 15px;
      color: rgba(244, 241, 234, 0.9);
    }

    .nav a {
      position: relative;
    }

    .nav a::after {
      content: "";
      position: absolute;
      left: 0;
      bottom: -7px;
      width: 100%;
      height: 1px;
      background: currentColor;
      transform: scaleX(0);
      transform-origin: right;
      transition: transform 180ms ease;
    }

    .nav a:hover::after {
      transform: scaleX(1);
      transform-origin: left;
    }

    .scene {
      position: absolute;
      inset: 0;
      z-index: 2;
    }

    .desktop-art,
    .mobile-art {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
    }

    .mobile-art {
      display: none;
    }

    .label-block {
      position: absolute;
      z-index: 6;
      pointer-events: none;
    }

    .past {
      left: 17.3%;
      top: 24.6%;
    }

    .future {
      right: 15.5%;
      top: 24.6%;
      text-align: right;
    }

    .now {
      left: 50%;
      top: 69%;
      text-align: center;
      transform: translateX(-50%);
    }

    .label {
      margin: 0 0 12px;
      color: var(--bright);
      font-size: 18px;
      letter-spacing: 0.34em;
      font-weight: 400;
    }

    .sub {
      margin: 0;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.55;
    }

    .footer {
      position: absolute;
      left: var(--side);
      right: var(--side);
      bottom: 34px;
      z-index: 10;
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
      gap: 24px;
      color: var(--muted);
      font-size: 13px;
    }

    .footer-left {
      justify-self: start;
    }

    .footer-center {
      justify-self: center;
    }

    .footer-right {
      justify-self: end;
    }

    svg {
      shape-rendering: geometricPrecision;
    }

    .glow {
      animation: softPulse 4.2s ease-in-out infinite;
    }

    .digital-dot {
      animation: digitalFlicker 5.8s ease-in-out infinite;
    }

    .digital-dot:nth-child(3n) {
      animation-delay: 1.4s;
    }

    .digital-dot:nth-child(4n) {
      animation-delay: 2.2s;
    }

    .analog-line {
      animation: analogDrift 7s ease-in-out infinite;
    }

    .analog-line:nth-child(odd) {
      animation-delay: 1.7s;
    }

    @keyframes softPulse {
      0%, 100% {
        opacity: 0.72;
      }
      50% {
        opacity: 1;
      }
    }

    @keyframes digitalFlicker {
      0%, 100% {
        opacity: 0.18;
      }
      50% {
        opacity: 0.62;
      }
    }

    @keyframes analogDrift {
      0%, 100% {
        transform: translateY(0);
      }
      50% {
        transform: translateY(2px);
      }
    }

    @media (max-width: 900px) {
      html,
      body {
        overflow: hidden;
      }

      .page {
        height: 100svh;
        min-height: 100svh;
      }

      .site-header {
        top: 30px;
        left: 28px;
        right: 28px;
        display: grid;
        grid-template-columns: 1fr;
        gap: 22px;
      }

      .brand {
        font-size: 28px;
      }

      .nav {
        width: 100%;
        justify-content: space-between;
        gap: 0;
        font-size: 15px;
      }

      .desktop-art {
        display: none;
      }

      .mobile-art {
        display: block;
      }

      .past {
        left: 28px;
        top: 20.5%;
      }

      .future {
        right: 28px;
        top: auto;
        bottom: 26%;
      }

      .now {
        top: 52%;
      }

      .label {
        font-size: 15px;
        letter-spacing: 0.34em;
      }

      .sub {
        font-size: 13px;
      }

      .footer {
        left: 28px;
        right: 28px;
        bottom: 30px;
        display: grid;
        grid-template-columns: 1fr;
        gap: 14px;
        font-size: 12.5px;
        line-height: 1.45;
      }

      .footer-left,
      .footer-center,
      .footer-right {
        justify-self: start;
      }

      .footer-center {
        display: block;
        color: rgba(244,241,234,0.42);
      }
    }

    @media (max-width: 520px) {
      .brand {
        font-size: 26px;
      }

      .nav {
        font-size: 14px;
      }

      .past {
        top: 22%;
      }

      .future {
        bottom: 25.5%;
      }

      .footer {
        bottom: 28px;
      }
    }
  </style>
</head>

  <script>
    document.addEventListener("dragstart", event => event.preventDefault());

    const page = document.querySelector(".page");
    const desktop = window.matchMedia("(min-width: 901px)");

    function handleMove(event) {
      if (!desktop.matches) return;

      const x = event.clientX / window.innerWidth - 0.5;
      const y = event.clientY / window.innerHeight - 0.5;

      page.style.setProperty("--mx", x);
      page.style.setProperty("--my", y);

      const art = document.querySelector(".desktop-art");
      if (art) {
        art.style.transform = `translate(${x * 8}px, ${y * 5}px)`;
      }
    }

    window.addEventListener("mousemove", handleMove);
  </script>
